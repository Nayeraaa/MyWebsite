<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>

<meta name="description" content="Elaf Alnayer — researcher and data analyst working across digital economy, governance, and open-source investigation."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/style.css"/>
<style>
/* ── LANDING — SIGNATURE COMPONENTS ─────────── */
html,body{height:100%}
body{display:flex;flex-direction:column}

.lp-hero{position:relative;flex:1;min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:120px 0 100px}
.lp-hero .grid-line{opacity:0.5}

.lp-inner{position:relative;z-index:2}

.lp-eyebrow{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);margin-bottom:40px}
.lp-dot{width:6px;height:6px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px rgba(78,205,196,0.7);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.35}}

.lp-name{font-family:var(--display);font-weight:700;line-height:0.92;letter-spacing:-3px;color:var(--sand);font-size:clamp(64px,12vw,168px);margin-bottom:36px;max-width:900px}
.lp-name .last{display:block;color:transparent;-webkit-text-stroke:1.5px var(--sand)}

.lp-role{font-family:var(--mono);font-size:clamp(13px,1.6vw,16px);letter-spacing:1px;color:var(--teal);margin-bottom:56px}
.lp-role::before{content:'> ';color:var(--muted)}

.lp-actions{display:flex;gap:16px;flex-wrap:wrap}

/* ── PHOTO / DECLASSIFY MOMENT ────────────── */
.lp-photo{position:absolute;right:var(--gap);top:50%;transform:translateY(-58%);width:200px;z-index:1}
.lp-frame{position:relative;width:100%;aspect-ratio:292/324;overflow:hidden;background:var(--surface);border:1px solid rgba(78,205,196,0.2)}
.lp-frame img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.05)}

.lp-bar{position:absolute;left:0;right:0;background:var(--night);z-index:3;animation:wipe 0.7s var(--ease) forwards}
.lp-bar.b1{top:0;height:22%;animation-delay:.5s}
.lp-bar.b2{top:38%;height:24%;animation-delay:.75s}
.lp-bar.b3{top:74%;height:26%;animation-delay:1s}
@keyframes wipe{to{transform:scaleX(0)}}
.lp-bar.b1{transform-origin:right}
.lp-bar.b2{transform-origin:left}
.lp-bar.b3{transform-origin:right}

.lp-corner{position:absolute;width:14px;height:14px;border-color:var(--teal);opacity:0;animation:tick-in .5s var(--ease) forwards;animation-delay:1.3s}
.lp-corner.tl{top:-1px;left:-1px;border-top:1px solid;border-left:1px solid}
.lp-corner.tr{top:-1px;right:-1px;border-top:1px solid;border-right:1px solid}
.lp-corner.bl{bottom:-1px;left:-1px;border-bottom:1px solid;border-left:1px solid}
.lp-corner.br{bottom:-1px;right:-1px;border-bottom:1px solid;border-right:1px solid}
@keyframes tick-in{to{opacity:1}}

.lp-caption{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-top:14px;text-align:center;opacity:0;animation:tick-in .6s var(--ease) forwards;animation-delay:1.5s}
.lp-caption span{color:var(--teal)}

/* ── COORDS FOOTER STRIP ──────────────────── */
.lp-coords{position:relative;z-index:2;font-family:var(--mono);font-size:10px;letter-spacing:1.5px;color:var(--muted);margin-top:88px}
.lp-coords a{color:var(--sand);border-bottom:1px solid rgba(232,224,208,0.25);transition:color .2s,border-color .2s}
.lp-coords a:hover{color:var(--teal);border-color:var(--teal)}

@media(max-width:900px){
  .lp-photo{display:none}
  .lp-name{letter-spacing:-2px}
}
@media(max-width:600px){
  .lp-hero{padding:110px 0 60px}
  .lp-actions{width:100%}
  .lp-actions a{width:100%;text-align:center}
}
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <div class="nav-logo">Elaf <span>Alnayer</span></div>
  <ul class="nav-links">
    <li><a href="cv.html">CV</a></li>
    <li><a href="projects.html">Projects</a></li>
  </ul>
  <a href="mailto:alnayer.eee@gmail.com" class="nav-badge">Say Hello</a>
</nav>

<!-- HERO -->
<section class="lp-hero">
  <div class="grid-line"></div>

  <div class="lp-photo">
    <div class="lp-frame">
      <img src="images/elaf.jpg" alt="Portrait of Elaf Alnayer"/>
      <div class="lp-bar b1"></div>
      <div class="lp-bar b2"></div>
      <div class="lp-bar b3"></div>
      <div class="lp-corner tl"></div>
      <div class="lp-corner tr"></div>
      <div class="lp-corner bl"></div>
      <div class="lp-corner br"></div>
    </div>
    <div class="lp-caption">Status: <span>Verified</span></div>
  </div>

  <div class="wrap lp-inner">
    <div class="lp-eyebrow"><span class="lp-dot"></span> Subject File — Open · United Arab Emirates</div>
    <h1 class="lp-name">
      <span class="first">Elaf</span>
      <span class="last">Alnayer</span>
    </h1>
    <p class="lp-role">Data Analyst — Researcher — Open-Source Investigator</p>
    <div class="lp-actions">
      <a href="cv.html" class="btn-primary">Read the CV</a>
      <a href="projects.html" class="btn-ghost">View Casework</a>
    </div>

    <div class="lp-coords">24.4539°N · 54.3773°E — <a href="mailto:alnayer.eee@gmail.com">alnayer.eee@gmail.com</a></div>
  </div>
</section>

</body>
</html>
